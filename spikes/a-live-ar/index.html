<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lash Live AR — spike A</title>
<style>
  :root { --bg:#0e0e10; --fg:#f2f2f2; --muted:#9a9aa3; --panel:#17171b; --line:#2a2a31; --accent:#e8a5b3; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 -apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo",sans-serif; }
  header { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; }
  header b { font-size:15px; }
  header span { color:var(--muted); }
  main { display:grid; grid-template-columns: 1fr 300px; min-height: calc(100vh - 49px); }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
  #stage { position:relative; background:#000; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  #stage video, #stage img { display:none; }
  #stage canvas { max-width:100%; max-height:calc(100vh - 49px); }
  #stage .msg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px; color:var(--muted); pointer-events:none; }
  aside { background:var(--panel); border-left:1px solid var(--line); padding:14px 16px; display:flex; flex-direction:column; gap:14px; overflow:auto; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  label { color:var(--muted); font-size:12px; display:block; margin-bottom:4px; }
  select, button, input[type=file] { background:#222228; color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font:inherit; }
  button.primary { background:var(--accent); color:#1a0e12; border-color:transparent; font-weight:600; }
  button.ghost { background:transparent; color:var(--muted); }
  button:disabled { opacity:.5; }
  .seg { display:flex; gap:4px; }
  .seg button { flex:1; padding:7px 0; }
  .seg button.on { background:var(--accent); color:#1a0e12; border-color:transparent; font-weight:600; }
  .zones { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; }
  .zones div { text-align:center; }
  .zones input { width:100%; writing-mode:vertical-lr; direction:rtl; height:90px; }
  .zones output { display:block; font-size:12px; color:var(--muted); }
  input[type=range] { width:100%; accent-color:var(--accent); }
  .hint { color:var(--muted); font-size:12px; }
  .ref { border:1px solid var(--line); border-radius:10px; padding:10px; display:flex; flex-direction:column; gap:8px; }
  .ref .ok { color:#bfe3c0; }
  .ref .err { color:#f2a0a0; }
  #stats { font-variant-numeric:tabular-nums; color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<header><b>Lash Live AR</b><span>spike A · 파라미터 렌더링 · 컬/구간 길이/볼륨</span></header>
<main>
  <section id="stage">
    <video id="video" playsinline muted></video>
    <img id="photo" alt="">
    <canvas id="canvas"></canvas>
    <div class="msg" id="msg">모델 불러오는 중…</div>
  </section>
  <aside>
    <div>
      <label>1. 내 눈</label>
      <div class="row">
        <button class="primary" id="btnCam">카메라 켜기</button>
        <button id="btnPhoto" class="ghost">셀카 사진으로 대신 테스트</button>
        <input type="file" id="file" accept="image/*" hidden>
      </div>
      <div class="hint" id="hint">인스타·카톡 안에서 열렸으면 카메라가 안 켜질 수 있어요. Safari/Chrome으로 여세요.</div>
    </div>

    <div class="ref">
      <label>2. 레퍼런스 (샵 시술 사진) → 래시 맵</label>
      <div class="row">
        <button class="primary" id="btnRef">레퍼런스 사진 올리기</button>
        <input type="file" id="refFile" accept="image/*" hidden>
        <img id="refThumb" alt="" style="display:none;height:44px;border-radius:6px;object-fit:cover">
      </div>
      <div class="hint" id="refStatus">인스타 스크린샷을 올리면 컬·구간 길이·볼륨·스타일·질감으로 번역해서 내 눈에 바로 적용해요. 카메라 화면은 그대로예요.</div>
    </div>

    <div>
      <label>스타일 프리셋</label>
      <div class="seg" id="style">
        <button data-v="natural" class="on">내추럴</button>
        <button data-v="cat">캣아이</button>
        <button data-v="doll">돌아이</button>
      </div>
    </div>
    <div>
      <label>컬</label>
      <div class="seg" id="curl">
        <button data-v="J">J</button>
        <button data-v="C" class="on">C</button>
        <button data-v="D">D</button>
      </div>
    </div>
    <div>
      <label>구간별 길이 (mm) · 눈앞 → 눈꼬리</label>
      <div class="zones" id="zones"></div>
    </div>
    <div>
      <label>질감</label>
      <div class="seg" id="texture">
        <button data-v="even" class="on">고르게</button>
        <button data-v="wispy">위스피(스파이크)</button>
      </div>
    </div>
    <div>
      <label>볼륨</label>
      <div class="seg" id="volume">
        <button data-v="natural" class="on">내추럴</button>
        <button data-v="volume">볼륨</button>
        <button data-v="mega">메가</button>
      </div>
    </div>
    <div>
      <label>진하기 <output id="opOut">0.85</output></label>
      <input type="range" id="opacity" min="0.3" max="1" step="0.05" value="0.85">
    </div>
    <div class="row">
      <button id="btnToggle">속눈썹 끄기</button>
      <button id="btnZoom">확대 끄기</button>
      <button id="btnMirror">거울 반전</button>
      <button id="btnSnap">캡처 저장</button>
    </div>
    <div id="stats">–</div>
    <div class="hint">눈 너비를 28mm로 가정해서 mm→px 환산. 눈꺼풀 가림(occlusion)·아래 속눈썹은 아직 없음.</div>
  </aside>
</main>

<script type="module">
import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

// ---- MediaPipe FaceMesh indices ----
// 이미지 기준 왼쪽 눈(피사체 오른눈): 바깥꼬리 33 → 안쪽 133
const R_UPPER = [33, 246, 161, 160, 159, 158, 157, 173, 133];
const R_LOWER = [33, 7, 163, 144, 145, 153, 154, 155, 133];
// 이미지 기준 오른쪽 눈(피사체 왼눈): 안쪽 362 → 바깥꼬리 263
const L_UPPER = [362, 398, 384, 385, 386, 387, 388, 466, 263];
const L_LOWER = [362, 382, 381, 380, 374, 373, 390, 249, 263];

const PRESETS = {
  natural: [8, 9, 10, 10, 9],
  cat:     [8, 9, 10, 11, 12],
  doll:    [9, 10, 12, 10, 9],
};
const CURL = { J: 0.35, C: 0.75, D: 1.15 };       // 끝단 회전(rad)
// 볼륨: 뿌리 수 × 뿌리당 가닥(부채꼴) 수
const VOLUME = { natural: [40, 1], volume: [42, 2], mega: [44, 3] };

const state = {
  zones: [...PRESETS.natural], curl: 'C', volume: 'natural',
  opacity: 0.85, show: true, mirror: true, mode: null, // 'video' | 'image'
  texture: 'even', zoom: true,
};
// 눈 확대 보기: 프레임 간 부드럽게 따라가는 뷰 상태
const view = { cx: 0, cy: 0, z: 1, init: false };

// ---- UI ----
const $ = s => document.querySelector(s);
const zonesEl = $('#zones');
function renderZones() {
  zonesEl.innerHTML = '';
  state.zones.forEach((v, i) => {
    const d = document.createElement('div');
    d.innerHTML = `<input type="range" min="6" max="15" step="1" value="${v}"><output>${v}</output>`;
    d.querySelector('input').addEventListener('input', e => {
      state.zones[i] = +e.target.value; d.querySelector('output').textContent = e.target.value; strands = null;
    });
    zonesEl.appendChild(d);
  });
}
renderZones();
function seg(id, onPick) {
  $(id).addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    [...$(id).children].forEach(x => x.classList.toggle('on', x === b));
    onPick(b.dataset.v);
  });
}
seg('#style', v => { state.zones = [...PRESETS[v]]; renderZones(); strands = null; });
seg('#curl', v => { state.curl = v; });
seg('#volume', v => { state.volume = v; strands = null; });
seg('#texture', v => { state.texture = v; strands = null; });
$('#opacity').addEventListener('input', e => { state.opacity = +e.target.value; $('#opOut').textContent = e.target.value; });
$('#btnToggle').addEventListener('click', e => { state.show = !state.show; e.target.textContent = state.show ? '속눈썹 끄기' : '속눈썹 켜기'; });
$('#btnMirror').addEventListener('click', () => { state.mirror = !state.mirror; });
$('#btnZoom').addEventListener('click', e => { state.zoom = !state.zoom; e.target.textContent = state.zoom ? '확대 끄기' : '눈 확대'; view.init = false; });
$('#btnSnap').addEventListener('click', () => {
  const a = document.createElement('a'); a.download = 'lash-live.png'; a.href = canvas.toDataURL('image/png'); a.click();
});

// 서버 번역 결과 → 상태/UI 반영
function setSeg(id, v) { [...$(id).children].forEach(x => x.classList.toggle('on', x.dataset.v === v)); }
function applyLashMap(m) {
  state.curl = m.curl; state.zones = [...m.zone_lengths_mm]; state.volume = m.volume; state.texture = m.texture || 'even';
  setSeg('#curl', m.curl); setSeg('#volume', m.volume); setSeg('#style', m.style); setSeg('#texture', state.texture);
  renderZones(); strands = null;
}
$('#refFile').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  const st = $('#refStatus'); st.className = 'hint'; st.textContent = '번역 중… (5~15초)';
  const thumb = $('#refThumb'); thumb.src = URL.createObjectURL(f); thumb.style.display = '';
  // 긴 변 1024px로 줄여서 전송 (비용·속도)
  const dataUrl = await downscale(f, 1024);
  try {
    const r = await fetch('/api/lashmap', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ image: dataUrl }) });
    const m = await r.json();
    if (!r.ok) throw new Error(m.error || r.status);
    if (!m.is_lash_photo) { st.className = 'hint err'; st.textContent = '속눈썹 사진으로 안 보여요: ' + m.notes; return; }
    applyLashMap(m);
    st.className = 'hint ok';
    st.textContent = `${m.curl}컬 · ${m.zone_lengths_mm.join('-')}mm · ${m.volume} · ${m.style} · 확신 ${Math.round(m.confidence * 100)}%
${m.notes}`;
  } catch (err) { st.className = 'hint err'; st.textContent = '실패: ' + err.message; }
});
function downscale(file, max) {
  return new Promise(res => {
    const img = new Image(); img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', 0.88)); URL.revokeObjectURL(img.src);
    }; img.src = URL.createObjectURL(file);
  });
}

// ---- Model ----
const video = $('#video'), photo = $('#photo'), canvas = $('#canvas'), ctx = canvas.getContext('2d');
const msg = $('#msg'), stats = $('#stats');
let landmarker, strands = null, lastVideoTime = -1, frames = 0, tPrev = performance.now(), fps = 0;

try {
  const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  landmarker = await FaceLandmarker.createFromOptions(vision, {
    baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task", delegate: "GPU" },
    runningMode: "VIDEO", numFaces: 1,
  });
  msg.textContent = '카메라를 켜거나 사진을 올리세요';
} catch (e) {
  msg.textContent = '모델 로드 실패: ' + e.message; console.error(e);
}

$('#btnPhoto').addEventListener('click', () => $('#file').click());
$('#btnRef').addEventListener('click', () => $('#refFile').click());
$('#btnCam').addEventListener('click', async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    video.srcObject = stream; await video.play();
    if (landmarker) await landmarker.setOptions({ runningMode: 'VIDEO' });
    state.mode = 'video'; state.mirror = true; msg.textContent = ''; strands = null;
    lastVideoTime = -1; requestAnimationFrame(loop);
  } catch (e) {
    msg.textContent = '카메라를 열 수 없어요: ' + e.name + '. 인앱 브라우저면 Safari/Chrome으로 여세요.'; console.error(e);
  }
});

$('#file').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  photo.src = URL.createObjectURL(f); await photo.decode();
  if (video.srcObject) { video.srcObject.getTracks().forEach(t => t.stop()); video.srcObject = null; }
  if (landmarker) await landmarker.setOptions({ runningMode: 'IMAGE' });
  state.mode = 'image'; state.mirror = false; msg.textContent = ''; strands = null;
  const res = landmarker.detect(photo);
  drawFrame(photo, photo.naturalWidth, photo.naturalHeight, res.faceLandmarks?.[0]);
  // 슬라이더 조작 시 다시 그리도록 루프
  const redraw = () => { if (state.mode !== 'image') return; drawFrame(photo, photo.naturalWidth, photo.naturalHeight, res.faceLandmarks?.[0]); requestAnimationFrame(redraw); };
  requestAnimationFrame(redraw);
});

function loop() {
  if (state.mode !== 'video') return;
  if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    const res = landmarker.detectForVideo(video, performance.now());
    drawFrame(video, video.videoWidth, video.videoHeight, res.faceLandmarks?.[0]);
    frames++; const now = performance.now();
    if (now - tPrev > 500) { fps = Math.round(frames * 1000 / (now - tPrev)); frames = 0; tPrev = now; }
  }
  requestAnimationFrame(loop);
}

// ---- Geometry ----
const v2 = (x, y) => ({ x, y });
const sub = (a, b) => v2(a.x - b.x, a.y - b.y), add = (a, b) => v2(a.x + b.x, a.y + b.y);
const mul = (a, s) => v2(a.x * s, a.y * s), len = a => Math.hypot(a.x, a.y);
const norm = a => { const l = len(a) || 1; return v2(a.x / l, a.y / l); };
const rot = (a, r) => v2(a.x * Math.cos(r) - a.y * Math.sin(r), a.x * Math.sin(r) + a.y * Math.cos(r));
const lerp = (a, b, t) => a + (b - a) * t;

// polyline 위의 t(0~1) 지점과 접선
function alongPolyline(pts, t) {
  const segs = []; let total = 0;
  for (let i = 0; i < pts.length - 1; i++) { const l = len(sub(pts[i + 1], pts[i])); segs.push(l); total += l; }
  let d = t * total;
  for (let i = 0; i < segs.length; i++) {
    if (d <= segs[i] || i === segs.length - 1) {
      const u = segs[i] ? Math.min(1, d / segs[i]) : 0;
      const p = add(pts[i], mul(sub(pts[i + 1], pts[i]), u));
      return { p, tan: norm(sub(pts[i + 1], pts[i])) };
    }
    d -= segs[i];
  }
}
function zoneLength(t) { // t: 0 눈앞 → 1 눈꼬리, 5구간을 부드럽게 보간
  const z = state.zones, x = t * (z.length - 1), i = Math.min(z.length - 2, Math.floor(x));
  return lerp(z[i], z[i + 1], x - i);
}

// 가닥 배치는 눈당 한 번만 뽑고(seed), 프레임마다 위치만 다시 계산
function makeStrands() {
  const [n, perRoot] = VOLUME[state.volume];
  const wispy = state.texture === 'wispy';
  const mk = () => {
    const out = [];
    // 위스피: 5~6뿌리마다 스파이크 중심. 근처 가닥은 길고 중심으로 모이고, 사이는 짧게
    const spikeEvery = 5 + Math.floor(Math.random() * 2);
    const spikes = [];
    if (wispy) for (let i = 2 + Math.floor(Math.random() * 3); i < n; i += spikeEvery) spikes.push((i + 0.5) / n);
    for (let i = 0; i < n; i++) {
      const t = (i + 0.5) / n + (Math.random() - 0.5) * 0.6 / n;
      // 눈앞 끝 5%는 아주 짧고 성글게 (실제 시술에서 안쪽은 비움)
      if (t < 0.05 || t > 0.99) continue;
      let lenMul = 1, conv = 0;
      if (wispy) {
        const sp = spikes.reduce((a, b) => Math.abs(b - t) < Math.abs(a - t) ? b : a, spikes[0] ?? t);
        const d = (sp - t) * n; // 뿌리 간격 단위 거리
        if (Math.abs(d) <= 1.2) { lenMul = 1.28; conv = d * 0.22; }   // 스파이크: 길고 중심으로 수렴
        else lenMul = 0.78;                                            // 베이스: 짧게
      }
      for (let k = 0; k < perRoot; k++) {
        out.push({
          t,
          lenJit: (0.9 + Math.random() * 0.2) * (t < 0.12 ? 0.7 : 1) * lenMul,
          fan: (k - (perRoot - 1) / 2) * 0.16 * (conv ? 0.3 : 1) + (Math.random() - 0.5) * 0.12 + conv,
          curlJit: 0.85 + Math.random() * 0.3,
          w: (0.75 + Math.random() * 0.4) * (lenMul > 1 ? 1.15 : 1),
        });
      }
    }
    return out;
  };
  return { R: mk(), L: mk() };
}

function drawEye(lm, upperIdx, lowerIdx, side, W, H, faceUp) {
  const P = i => v2(lm[i].x * W, lm[i].y * H);
  let upper = upperIdx.map(P), lower = lowerIdx.map(P);
  // 눈앞(안쪽) → 눈꼬리(바깥) 순으로 통일
  if (side === 'R') { upper = upper.slice().reverse(); lower = lower.slice().reverse(); }
  const inner = upper[0], outer = upper[upper.length - 1];
  const width = len(sub(outer, inner));
  const pxPerMm = width / 28;
  // 눈 중심(가림/방향 기준)과 개방도
  const cUp = upper[Math.floor(upper.length / 2)], cLo = lower[Math.floor(lower.length / 2)];
  const center = mul(add(cUp, cLo), 0.5);
  const openness = Math.min(1, len(sub(cUp, cLo)) / (width * 0.32)); // 0 감김 ~ 1 완전 뜸
  const axis = norm(sub(outer, inner)); // 눈앞→눈꼬리
  const list = strands[side];

  ctx.lineCap = 'round';
  for (const s of list) {
    const { p, tan } = alongPolyline(upper, s.t);
    // 접선에 수직, 눈 중심에서 멀어지는 쪽이 바깥(위)
    let nrm = v2(-tan.y, tan.x);
    if ((nrm.x * (p.x - center.x) + nrm.y * (p.y - center.y)) < 0) nrm = mul(nrm, -1);
    // 눈이 감길수록 가닥이 눈꺼풀 방향(아래)으로 누움
    nrm = norm(add(mul(nrm, 0.35 + 0.65 * openness), mul(faceUp, -(1 - openness) * 0.5)));
    // 눈꼬리로 갈수록 바깥으로 부채꼴
    const fanDir = norm(add(nrm, mul(axis, (s.t - 0.35) * 0.5 + s.fan)));
    const L = zoneLength(s.t) * pxPerMm * s.lenJit;
    const curl = CURL[state.curl] * s.curlJit;
    // 뿌리를 눈꺼풀 라인 살짝 안쪽에서 시작 (붙인 티 줄이기)
    const root = sub(p, mul(nrm, pxPerMm * 0.5));
    // 컬은 얼굴 위쪽(faceUp) 방향으로 감김
    const sign = Math.sign(fanDir.x * faceUp.y - fanDir.y * faceUp.x) || 1; // faceUp 쪽으로 도는 회전 방향
    const d1 = rot(fanDir, -sign * curl * 0.45), d2 = rot(fanDir, -sign * curl);
    const c1 = add(root, mul(fanDir, L * 0.4));
    const c2 = add(root, add(mul(fanDir, L * 0.55), mul(d1, L * 0.3)));
    const end = add(c2, mul(d2, L * 0.3));
    // 테이퍼: 뿌리 굵고 진하게 → 끝은 가늘고 옅게
    const segs = 6, base = (0.7 + 0.55 * pxPerMm / 6) * s.w;
    let prev = root;
    for (let k = 1; k <= segs; k++) {
      const u = k / segs, q = bez(root, c1, c2, end, u);
      ctx.beginPath(); ctx.moveTo(prev.x, prev.y); ctx.lineTo(q.x, q.y);
      ctx.lineWidth = Math.max(0.35, base * (1 - u * 0.85));
      ctx.strokeStyle = `rgba(14,9,11,${state.opacity * (1.05 - u * 0.4)})`;
      ctx.stroke(); prev = q;
    }
  }
  return { width, openness };
}
function bez(p0, p1, p2, p3, t) {
  const m = 1 - t;
  return v2(
    m*m*m*p0.x + 3*m*m*t*p1.x + 3*m*t*t*p2.x + t*t*t*p3.x,
    m*m*m*p0.y + 3*m*m*t*p1.y + 3*m*t*t*p2.y + t*t*t*p3.y,
  );
}

function drawFrame(src, W, H, lm) {
  if (canvas.width !== W || canvas.height !== H) { canvas.width = W; canvas.height = H; }
  ctx.save();
  ctx.clearRect(0, 0, W, H);
  if (state.mirror) { ctx.translate(W, 0); ctx.scale(-1, 1); }
  // 눈 확대: 양쪽 눈 바운딩 박스 기준으로 확대. 목표값을 프레임마다 lerp 해서 떨림 줄임
  if (state.zoom && lm) {
    const xs = [33, 133, 362, 263, 159, 145, 386, 374].map(i => lm[i].x * W);
    const ys = [33, 133, 362, 263, 159, 145, 386, 374].map(i => lm[i].y * H);
    const bw = Math.max(...xs) - Math.min(...xs), bh = Math.max(...ys) - Math.min(...ys);
    const tcx = (Math.max(...xs) + Math.min(...xs)) / 2, tcy = (Math.max(...ys) + Math.min(...ys)) / 2;
    const tz = Math.max(1, Math.min(4, Math.min(W / (bw * 1.35), H / (bh * 4))));
    if (!view.init) { view.cx = tcx; view.cy = tcy; view.z = tz; view.init = true; }
    const a = 0.15; view.cx += (tcx - view.cx) * a; view.cy += (tcy - view.cy) * a; view.z += (tz - view.z) * a;
    ctx.translate(W / 2, H / 2); ctx.scale(view.z, view.z); ctx.translate(-view.cx, -view.cy);
  } else if (state.zoom && view.init) {
    // 얼굴을 잠깐 놓쳐도 마지막 뷰 유지
    ctx.translate(W / 2, H / 2); ctx.scale(view.z, view.z); ctx.translate(-view.cx, -view.cy);
  }
  ctx.drawImage(src, 0, 0, W, H);
  if (lm && state.show) {
    if (!strands) strands = makeStrands();
    // 얼굴 위 방향: 양 눈 중심 → 이마(10) 방향
    const eyeMid = v2((lm[33].x + lm[263].x) / 2 * W, (lm[33].y + lm[263].y) / 2 * H);
    const faceUp = norm(sub(v2(lm[10].x * W, lm[10].y * H), eyeMid));
    ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = 0.8;
    const r = drawEye(lm, R_UPPER, R_LOWER, 'R', W, H, faceUp);
    const l = drawEye(lm, L_UPPER, L_LOWER, 'L', W, H, faceUp);
    ctx.shadowBlur = 0;
    const small = Math.min(r.width, l.width) < 70;
    stats.textContent = `${fps ? fps + ' fps · ' : ''}눈 너비 ${Math.round(r.width)}/${Math.round(l.width)}px${small ? ' · 카메라에 더 가까이 오면 선명해져요' : ''} · ${state.curl}컬 ${state.zones.join('-')}mm ${state.volume} ${state.texture}`;
  } else if (state.mode) {
    stats.textContent = lm ? '속눈썹 꺼짐' : '얼굴을 못 찾았어요';
  }
  ctx.restore();
}
</script>
