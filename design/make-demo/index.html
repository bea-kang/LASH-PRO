:root{--ink:#171719;--muted:#6f7077;--ivory:#f6f6f3;--paper:#ffffff;--plum:#75506a;--rose:#ece6eb;--line:#dedede;--skin1:#e4bda8;--skin2:#a96f5e;--white:#ffffff}body{font-family:Manrope,Inter,Pretendard,"Helvetica Neue",sans-serif;background:#e8e8e5}.brand,h1,h2,.hero-copy{font-family:Manrope,Inter,Pretendard,"Helvetica Neue",sans-serif}.brand{font-weight:700;letter-spacing:.12em}h1,h2{font-weight:600;letter-spacing:-.045em}.hero-copy{font-weight:600;letter-spacing:-.025em}.phone{box-shadow:0 24px 70px rgba(21,21,24,.15)}.primary{background:#171719;border-color:#171719}.design.on,.chip.on{border-color:#75506a;box-shadow:0 0 0 1px #75506a}.live-badge{background:rgba(23,23,25,.76)}
